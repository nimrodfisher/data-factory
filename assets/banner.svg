      <g transform="translate(262,322)"><rect width="160" height="38" rx="19" fill="#1e2747" stroke="#3B82F6"/><text x="80" y="24" text-anchor="middle">data-analyst</text></g>
      <g transform="translate(436,322)"><rect width="178" height="38" rx="19" fill="#1e2747" stroke="#3B82F6"/><text x="89" y="24" text-anchor="middle">data-scientist</text></g>
      <g transform="translate(628,322)"><rect width="150" height="38" rx="19" fill="#1e2747" stroke="#3B82F6"/><text x="75" y="24" text-anchor="middle">bi-engineer</text></g>
      <g transform="translate(792,322)"><rect width="196" height="38" rx="19" fill="#2a1d4d" stroke="#7C3AED"/><text x="98" y="24" text-anchor="middle">quality-inspector</text></g>
