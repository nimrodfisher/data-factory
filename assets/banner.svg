      <g stroke="#e6e8f2" stroke-opacity=".8"><rect x="22" y="112" width="30" height="24" rx="3"/><rect x="66" y="112" width="30" height="24" rx="3"/><rect x="110" y="112" width="30" height="24" rx="3"/></g>
